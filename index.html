<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Георгий Созанов — Программист</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --card: #111111;
      --border: #1e1e1e;
      --accent1: #7c3aed;
      --accent2: #06b6d4;
      --accent3: #a78bfa;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      overflow-x: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124,58,237,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,58,237,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glowing orbs */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 400px at 20% 20%, rgba(124,58,237,.12) 0%, transparent 70%),
        radial-gradient(ellipse 500px 400px at 80% 80%, rgba(6,182,212,.10) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 52px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(124,58,237,.15),
        0 24px 80px rgba(0,0,0,.6),
        0 0 80px rgba(124,58,237,.08);
      animation: cardIn .6s cubic-bezier(.22,1,.36,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(32px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Top accent line */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent1), var(--accent2), transparent);
      border-radius: 0 0 4px 4px;
    }

    /* Avatar placeholder */
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      margin: 0 auto 24px;
      position: relative;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -1px;
      flex-shrink: 0;
    }

    .avatar::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      z-index: -1;
      filter: blur(10px);
      opacity: .6;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: .5; transform: scale(1); }
      50%       { opacity: .9; transform: scale(1.08); }
    }

    /* Name */
    .name {
      font-size: clamp(26px, 6vw, 34px);
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.1;
      background: linear-gradient(135deg, #fff 0%, var(--accent3) 50%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 20px rgba(167,139,250,.4));
      animation: shimmer 4s linear infinite;
      background-size: 200% auto;
    }

    @keyframes shimmer {
      0%   { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    /* Role badge */
    .role {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(124,58,237,.15);
      border: 1px solid rgba(124,58,237,.3);
      color: var(--accent3);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .6px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 99px;
      margin-bottom: 32px;
    }

    .role svg { flex-shrink: 0; }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), var(--border), transparent);
      margin-bottom: 28px;
    }

    /* Social links */
    .socials {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.03);
      color: var(--muted);
      text-decoration: none;
      transition: all .25s cubic-bezier(.22,1,.36,1);
      position: relative;
      overflow: hidden;
    }

    .social-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .25s;
      border-radius: inherit;
    }

    .social-btn:hover {
      transform: translateY(-4px) scale(1.08);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }

    .social-btn.tg::before  { background: linear-gradient(135deg,#2196f3,#29b6f6); }
    .social-btn.gh::before  { background: linear-gradient(135deg,#4a4a4a,#888); }
    .social-btn.vk::before  { background: linear-gradient(135deg,#1a75c4,#2196f3); }
    .social-btn.mail::before{ background: linear-gradient(135deg,#ea4335,#fb8c00); }

    .social-btn:hover::before { opacity: 1; }
    .social-btn svg { position: relative; z-index: 1; transition: transform .25s; }
    .social-btn:hover svg { transform: scale(1.1); }

    /* CTA Button */
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 15px 28px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .3px;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(135deg, var(--accent1) 0%, #4f46e5 50%, var(--accent2) 100%);
      background-size: 200% auto;
      box-shadow: 0 4px 24px rgba(124,58,237,.45);
      transition: all .3s cubic-bezier(.22,1,.36,1);
      animation: btnGlow 3s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }

    @keyframes btnGlow {
      0%, 100% { box-shadow: 0 4px 24px rgba(124,58,237,.45); }
      50%       { box-shadow: 0 4px 40px rgba(124,58,237,.75), 0 0 0 4px rgba(124,58,237,.1); }
    }

    .cta::after {
      content: '';
      position: absolute;
      top: -50%; left: -60%;
      width: 40%; height: 200%;
      background: rgba(255,255,255,.12);
      transform: skewX(-20deg);
      transition: left .5s ease;
    }

    .cta:hover::after { left: 140%; }

    .cta:hover {
      background-position: right center;
      transform: translateY(-2px);
      box-shadow: 0 8px 40px rgba(124,58,237,.65);
    }

    .cta:active { transform: translateY(0) scale(.98); }

    /* Status dot */
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
      margin-top: 20px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: .4; }
    }

    @media (max-width: 480px) {
      .card { padding: 40px 28px; }
    }
  </style>
</head>
<body>
